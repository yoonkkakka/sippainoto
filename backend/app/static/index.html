<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>실패작 노트</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="app">

  <div id="authView">
    <img src="/static/mascot.png" alt="마스코트" class="mascot mascot-splash" />
    <h1>실패작 노트</h1>
    <div class="subtitle">오늘의 실패 한 장을 적어보세요.</div>
    <div class="card">
      <label>이메일</label>
      <input id="authEmail" type="email" placeholder="you@example.com" />
      <label>비밀번호</label>
      <input id="authPassword" type="password" placeholder="6자 이상" />
      <div id="authError" class="error hidden"></div>
      <div class="row">
        <button id="loginBtn">로그인</button>
        <button id="signupBtn" class="secondary">회원가입</button>
      </div>
    </div>
  </div>

  <div id="mainView" class="hidden">
    <div class="header-row">
      <img src="/static/mascot.png" alt="마스코트" class="mascot mascot-avatar" />
      <div>
        <h1>실패작 노트</h1>
        <div class="subtitle">오늘 <span id="todayCount" class="count-badge">0/5</span></div>
      </div>
      <span class="logout-link right" id="logoutBtn">로그아웃</span>
    </div>

    <nav class="tabbar">
      <button class="tabBtn active" data-view="today">오늘</button>
      <button class="tabBtn" data-view="notebooks">노트북</button>
      <button class="tabBtn" data-view="stats">통계</button>
      <button class="tabBtn" data-view="exports">보관함</button>
      <button class="tabBtn" data-view="settings">설정</button>
    </nav>

    <section id="view-today" class="view">
      <div class="card">
        <label>제목 (선택)</label>
        <input id="entryTitle" type="text" placeholder="오늘의 실패 제목" />
        <label>오늘의 실패</label>
        <textarea id="entryContent" rows="5" placeholder="무슨 일이 있었나요?"></textarea>
        <label style="display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="emotionTag" style="width:auto;margin:0;" />
          감정 노트로 보내기
        </label>
        <div id="entryError" class="error hidden"></div>
        <button id="submitEntryBtn">저장하기</button>
      </div>

      <div class="card">
        <h2 class="card-title">최근 기록</h2>
        <div id="entryList"></div>
      </div>
    </section>

    <section id="view-notebooks" class="view hidden">
      <div class="card">
        <h2 class="card-title">실패작 노트</h2>
        <div id="notebookList-failure"></div>
      </div>
      <div class="card">
        <h2 class="card-title">감정 노트</h2>
        <div id="notebookList-emotion"></div>
      </div>
    </section>

    <section id="view-stats" class="view hidden">
      <div class="card" id="statsCard">
        <h2 class="card-title">통계</h2>
        <div id="statsBody"></div>
      </div>
    </section>

    <section id="view-exports" class="view hidden">
      <div class="card">
        <h2 class="card-title">PDF로 출판하기</h2>
        <div class="subtitle" style="text-align:left;margin-bottom:12px;">155장을 채워 완결된 노트북만 출판할 수 있어요.</div>
        <label>노트북 선택</label>
        <select id="exportNotebookSelect"></select>
        <label>제본 스타일</label>
        <select id="exportBindingSelect">
          <option value="kr">한국식</option>
          <option value="jp">일본식</option>
        </select>
        <label>표지 테마</label>
        <input id="exportCoverTheme" type="text" value="mono" />
        <div id="exportError" class="error hidden"></div>
        <button id="exportCreateBtn">PDF 생성</button>
      </div>
      <div class="card">
        <h2 class="card-title">내보낸 파일</h2>
        <div id="exportList"></div>
      </div>
    </section>

    <section id="view-settings" class="view hidden">
      <div class="card">
        <h2 class="card-title">계정 설정</h2>
        <label>닉네임</label>
        <input id="settingsNickname" type="text" />
        <label>타임존</label>
        <input id="settingsTimezone" type="text" placeholder="Asia/Seoul" />
        <label style="display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="settingsAppLock" style="width:auto;margin:0;" />
          앱 잠금 사용
        </label>
        <div id="settingsError" class="error hidden"></div>
        <button id="settingsSaveBtn">저장</button>
      </div>
      <div class="card">
        <h2 class="card-title">내 데이터 내보내기</h2>
        <div class="subtitle" style="text-align:left;margin-bottom:12px;">프로필, 노트북, 글 전체를 JSON 파일로 내려받아요.</div>
        <button id="dataExportBtn" class="secondary">JSON으로 내려받기</button>
      </div>
    </section>
  </div>

</div>

<div id="confirmModal" class="modal-overlay hidden">
  <div class="box">
    <div id="confirmMessage"></div>
    <div class="row" style="margin-top:16px;">
      <button id="confirmCancelBtn" class="secondary">취소</button>
      <button id="confirmOkBtn">삭제</button>
    </div>
  </div>
</div>

<div id="crisisModal" class="modal-overlay hidden">
  <div class="box">
    <div>혼자 견디기 힘든 마음이 느껴져요.</div>
    <div class="phone">109</div>
    <div>자살예방상담전화에 연결하면 도움을 받을 수 있어요.</div>
    <button id="crisisCloseBtn" style="margin-top:16px;">닫기</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
